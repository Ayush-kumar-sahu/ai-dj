[theme]
base = "dark"
primaryColor = "#ff3dcb"
backgroundColor = "#07050f"
secondaryBackgroundColor = "#150f27"
textColor = "#f3efff"
linkColor = "#2ee6ff"
borderColor = "#2a2142"
baseRadius = "0.85rem"
buttonRadius = "full"
font = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Unbounded:https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&display=swap, sans-serif"
headingFontWeights = [800, 800, 700, 700, 700, 600]

[server]
maxUploadSize = 500

[browser]
gatherUsageStats = false
